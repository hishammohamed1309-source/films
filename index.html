<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-black text-amber-400 tracking-wider">ShowBox</h1>
      <form id="search-form" class="flex gap-2 w-full md:w-auto">
        <input id="search-input" type="text" placeholder="ابحث عن فيلم أو مسلسل..." class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg focus:outline-none focus:border-amber-400 text-sm w-full md:w-64">
        <button type="submit" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm shadow-lg shadow-amber-400/10 hover:shadow-amber-400/20 transition-all duration-300">بحث</button>
      </form>
    </header>
    <section class="max-w-7xl mx-auto px-6 py-6 flex flex-wrap justify-between items-center gap-4">
      <p id="status" class="text-slate-400 text-md font-medium">جاري التحميل...</p>
      <div class="flex gap-4">
        <select id="genre" class="bg-slate-800 bg-amber-400 hover:shadow-amber-400/20 transition-all duration-300 border border-slate-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400">
                <option value="all">كل التصنيفات (All genres)</option>
            </select>
            
            <select id="sort" class="bg-slate-800 bg-amber-400 hover:shadow-amber-400/20 transition-all duration-300 border border-slate-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400">
              <option value="default">الترتيب الافتراضي</option>
                <option value="rating">حسب التقييم (الأعلى)</option>
                <option value="name">حسب الاسم (أبجدي)</option>
            </select>
      </div>
    </section>
    <main class="max-w-7xl mx-auto px-6 pb-12">
        <section id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></section>
    </main>
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl">
            <button class="close absolute top-4 left-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <div id="modal-body" class="flex flex-col md:flex-row gap-6">
    </div>
        </div>
          </div>
    <script src="./app.js" ></script>
  </body>
</html>
